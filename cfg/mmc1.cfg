# TCHAK ! - carte memoire ld65 d'UNE banque MMC1 de 32 Ko (mode PRG 32 Ko)
#
#  $8000-$DFFF  moteur commun : IDENTIQUE dans toutes les banques
#               (verifie octet par octet par tools/make_rom.py)
#  $E000-$FFF9  partie propre a la banque : table de sauts + en-tete
#               (metatuiles, salles, palette) puis code et donnees du monde
#               ou des menus
#  $FFFA-$FFFF  vecteurs (identiques)
#
#  RAM : $0300-$073F variables du moteur, $0740-$077F variables de banque,
#        $0780-$07FF pile C.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0080;
}
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, define = yes;
    OAM:    start = $0200, size = $0100, type = rw;
    RAM:    start = $0300, size = $0440, type = rw, define = yes;
    BRAM:   start = $0740, size = $0040, type = rw;
    PRG:    start = $8000, size = $6000, type = ro, file = %O, fill = yes, define = yes;
    BANK:   start = $E000, size = $1FFA, type = ro, file = %O, fill = yes, define = yes;
    VECT:   start = $FFFA, size = $0006, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = PRG,  type = ro, define = yes;
    LOWCODE:  load = PRG,  type = ro, optional = yes;
    ONCE:     load = PRG,  type = ro, optional = yes;
    CODE:     load = PRG,  type = ro, define = yes;
    RODATA:   load = PRG,  type = ro, define = yes;
    DATA:     load = PRG, run = RAM, type = rw, define = yes;
    BSS:      load = RAM,  type = bss, define = yes;
    OAM:      load = OAM,  type = bss;
    BANKHDR:  load = BANK, type = ro;
    BANKCODE: load = BANK, type = ro, optional = yes;
    BANKDATA: load = BANK, type = ro, optional = yes;
    BANKBSS:  load = BRAM, type = bss, optional = yes;
    VECTORS:  load = VECT, type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
